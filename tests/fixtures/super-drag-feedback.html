<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>超级拖拽提示测试</title>
  <style>
    body { max-width: 900px; margin: 36px auto; padding: 0 24px; font: 16px/1.6 sans-serif; }
    h1 { font-size: 24px; }
    .hint { color: #555; }
    .sample { margin: 30px 0; padding: 18px; border: 1px solid #ccc; border-radius: 8px; }
    #image { width: 100px; height: 70px; object-fit: contain; background: #dceef9; vertical-align: middle; }
    #gesture-target { min-height: 120px; background: #f3f7f4; }
  </style>
</head>
<body>
  <h1>超级拖拽提示测试</h1>
  <p class="hint">按住链接、图片或选中的文字拖动，查看页面顶部的方向和命令提示。</p>
  <p class="hint">拖到顶部的“取消”区域再松开，可以取消本次操作。</p>
  <div class="sample"><a id="link" href="/target">可拖拽的本地测试链接</a></div>
  <div class="sample"><img id="image" src="/pixel.png" alt="可拖拽的本地测试图片"></div>
  <div class="sample"><span id="text">这是一段可选中并拖拽的测试文字。</span></div>
  <div class="sample" id="gesture-target">在这里按住右键画鼠标手势，可以对比提示样式。</div>
</body>
</html>
