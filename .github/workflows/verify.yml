name: 验证

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: 安装归档工具和 Chrome for Testing 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip libnss3 libatk-bridge2.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
          deno run -A npm:puppeteer browsers install chrome@152.0.7977.64
          CHROME_PATH="$HOME/.cache/puppeteer/chrome/linux-152.0.7977.64/chrome-linux64/chrome"
          test -x "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: 完整自动化门禁
        run: deno run -A scripts/verify.js --report local-development/tracking/ci-verification.json
