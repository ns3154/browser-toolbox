name: 验证

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: 安装归档工具和 Chrome for Testing 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip unzip xvfb libnss3 libatk-bridge2.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
          CFT_VERSION="152.0.7977.64"
          CFT_DIR="$HOME/.cache/puppeteer/chrome/linux-${CFT_VERSION}"
          CFT_ZIP="$(mktemp -t chrome-linux64.XXXXXX.zip)"
          mkdir -p "$CFT_DIR"
          curl -fsSL --retry 3 "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip" -o "$CFT_ZIP"
          unzip -q -o "$CFT_ZIP" -d "$CFT_DIR"
          rm -f "$CFT_ZIP"
          if [ -f "${CFT_DIR}/chrome-linux64/deb.deps" ]; then
            sudo apt-get satisfy -y "$(grep -v '^[[:space:]]*$' "${CFT_DIR}/chrome-linux64/deb.deps" | paste -sd,)" --no-install-recommends
          fi
          CHROME_PATH="${CFT_DIR}/chrome-linux64/chrome"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          # Ubuntu 24.04+/26.04 runner 默认启用 AppArmor 非特权 userns 限制，会导致隔离 Chrome 沙箱启动失败。
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          "$CHROME_PATH" --headless --dump-dom about:blank >/dev/null
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: 完整自动化门禁
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" deno run -A scripts/verify.js --report local-development/tracking/ci-verification.json
